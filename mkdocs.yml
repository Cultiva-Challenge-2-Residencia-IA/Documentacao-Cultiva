site_name: CULTIVA
site_description: Empoderando pessoas com IA para compreender melhor, decidir melhor e viver melhor. Documentação do projeto do Grupo 12.
site_author: Equipe CULTIVA (Grupo 12)
site_url: https://cultiva-challenge-2-residencia-ia.github.io/Documentacao-Cultiva/
repo_url: https://github.com/Cultiva-Challenge-2-Residencia-IA/Documentacao-Cultiva
repo_name: Documentacao-Cultiva
edit_uri: edit/main/docs/
copyright: Equipe CULTIVA &middot; Grupo 12

theme:
  name: material
  language: pt-BR
  icon:
    logo: material/sprout-outline
    repo: fontawesome/brands/github
  font:
    text: Krub
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Cultiva-Challenge-2-Residencia-IA/Documentacao-Cultiva
      name: Repositório no GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Início: index.md
  - Projeto:
      - projeto/index.md
      - Problema e Evidências: projeto/problema.md
      - Stakeholders: projeto/stakeholders.md
      - Personas: projeto/personas.md
      - Premissas: projeto/premissas.md
  - Regras de Negócio: regras-de-negocio.md
  - Requisitos:
      - requisitos/index.md
      - Funcionais (Software): requisitos/funcionais.md
      - Funcionais (IA): requisitos/ia.md
      - Não Funcionais: requisitos/nao-funcionais.md
      - Backlog: requisitos/backlog.md
  - Arquitetura (provisória): arquitetura.md
  - Entregas:
      - Semana 2 (RAG de Nutrição): entregas/semana-2.md
      - Histórico de mudanças: historico.md
  - Qualidade:
      - Riscos: riscos.md
      - Métricas de Sucesso: metricas.md
  - Decisões:
      - Registro de decisões: decisoes.md
      - Guiding Questions: guiding-questions.md
      - Pendências: pendencias.md
  - Equipe: equipe.md
